map $http_upgrade $city_front_connection {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=city_front_http:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name GAME_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name GAME_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/GAME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GAME_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:7460/healthz;
        access_log off;
    }

    location /rooms {
        proxy_pass http://127.0.0.1:7460;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $city_front_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        limit_req zone=city_front_http burst=60 nodelay;
        proxy_pass http://127.0.0.1:7460;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
